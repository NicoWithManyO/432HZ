# Configuration de l'outillage de dev (tests, lint). Pas un packaging Python.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Les migrations sont auto-générées par Django : hors périmètre du lint.
extend-exclude = [".venv", "staticfiles", "node_modules", "**/migrations/*"]

[tool.ruff.lint]
# Erreurs/pyflakes, imports triés, upgrades, bugbear.
select = ["E", "F", "I", "UP", "B"]
