{% extends "gestion/base_gestion.html" %}

{% block title %}Créer mon compte · Gestion 432 Hz{% endblock %}

{% block gestion %}
<div class="max-w-md mx-auto">
  <span class="font-mono uppercase tracking-[.16em] text-[.72rem] text-red">Invitation</span>
  <h1 class="font-display font-black text-[clamp(2rem,5vw,2.8rem)] leading-none mt-2 mb-2">Bienvenue</h1>
  <p class="text-ink-soft mb-6">Choisis ton identifiant et ton mot de passe pour rejoindre la gestion.</p>

  <form method="post" class="gestion-form flex flex-col gap-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn--red mt-2">Créer mon compte</button>
  </form>
</div>
{% endblock %}
