{% extends "base.html" %}

{% block title %}Connexion · Gestion 432 Hz{% endblock %}

{% block content %}
<section class="wrap py-[clamp(40px,8vw,80px)] max-w-md">
  <h1 class="font-display font-black text-4xl mb-6">Connexion</h1>
  <form method="post" class="flex flex-col gap-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-red text-paper border-2 border-ink shadow-hard px-5 py-3 font-extrabold">Se connecter</button>
  </form>
</section>
{% endblock %}
